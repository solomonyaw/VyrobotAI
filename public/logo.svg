<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0047E0" />
      <stop offset="100%" stop-color="#002B9E" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>

    <!-- White-to-Silver Gradient for V-Arrow -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" filter="url(#glowFilter)" />
  
  <!-- Outer glowing rim -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.4" />

  <!-- Robot Mascot Head -->
  <g transform="translate(250, 195)">
    <!-- Antenna -->
    <line x1="0" y1="-65" x2="0" y2="-45" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <circle cx="0" cy="-68" r="8" fill="#00F0FF" filter="url(#eyeGlow)" />

    <!-- Robot Ears / Side Sensors -->
    <rect x="-68" y="-22" width="14" height="30" rx="7" fill="#E2E8F0" />
    <rect x="54" y="-22" width="14" height="30" rx="7" fill="#E2E8F0" />
    
    <!-- Main Head Shell -->
    <rect x="-60" y="-45" width="120" height="90" rx="42" fill="#FFFFFF" />
    <rect x="-56" y="-41" width="112" height="82" rx="38" fill="#F8FAFC" />

    <!-- Screen Visor Faceplate -->
    <rect x="-44" y="-28" width="88" height="54" rx="22" fill="#06122E" stroke="#1E3A8A" stroke-width="2" />

    <!-- Glowing Cyan Eyes -->
    <rect x="-30" y="-12" width="22" height="14" rx="5" fill="#00F0FF" filter="url(#eyeGlow)" />
    <rect x="8" y="-12" width="22" height="14" rx="5" fill="#00F0FF" filter="url(#eyeGlow)" />
  </g>

  <!-- Giant 3D 'V' Arrow & Geometric Wings -->
  <!-- Left wing polygon with circuit pattern -->
  <path d="M150 250 L250 375 L205 375 L115 260 Z" fill="#00C8FF" opacity="0.8" />
  <path d="M175 270 L230 350 L200 350 L155 285 Z" fill="#38BDF8" opacity="0.9" />

  <!-- Main White 3D 'V' Ascending to Right Arrow -->
  <path d="M 120 260 L 210 260 L 250 375 L 340 230 L 320 230 L 355 190 L 395 240 L 365 240 L 265 405 L 235 405 Z" fill="url(#whiteGrad)" />

  <!-- Orbital Ring Sweeping Around Base -->
  <path d="M 130 345 C 160 380, 320 370, 360 290" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.95" />
  <path d="M 130 345 C 160 380, 320 370, 360 290" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#eyeGlow)" />
</svg>
